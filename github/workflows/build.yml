name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          mkdir www && cp ../index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.klaket.app","appName":"كلاكيت","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}
          JSON
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: klaket-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
